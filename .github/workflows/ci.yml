name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type-check and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check and lint
        run: npm run check

      - name: Run tests
        run: npm test
