name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build, Package, and Submit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package Extension
        run: npm run package

      - name: Locate Packaged Zip
        id: locate_zip
        run: |
          ZIP_FILE=$(find dist -maxdepth 1 -name "widemark-v*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: Packaged zip file not found in dist/"
            exit 1
          fi
          echo "Found package zip: $ZIP_FILE"
          echo "zip_path=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Upload & Submit for Review
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: ${{ steps.locate_zip.outputs.zip_path }}
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true

