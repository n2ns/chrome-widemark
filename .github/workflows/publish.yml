name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'

permissions:
  # write: create the GitHub Release with the downloadable zip
  contents: write

concurrency:
  group: chrome-web-store-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Package, and Submit
    runs-on: ubuntu-latest
    environment: chrome-web-store

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package Extension
        run: npm run package

      - name: Locate Packaged Zip
        id: locate_zip
        run: |
          ZIP_FILE=$(find dist -maxdepth 1 -name "widemark-v*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: Packaged zip file not found in dist/"
            exit 1
          fi
          echo "Found package zip: $ZIP_FILE"
          echo "zip_path=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_FILE: ${{ steps.locate_zip.outputs.zip_path }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Release notes: this version's CHANGELOG section, plus manual install steps.
          awk -v v="$VERSION" '/^## \[/{p = index($0, "## [" v "]") == 1; next} p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md for changes." > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ## Install manually

          1. Download the `.zip` file below and unzip it into a folder you will keep.
          2. Open `chrome://extensions` in Chrome and turn on **Developer mode** (top right).
          3. Click **Load unpacked** and select the unzipped folder (the one that contains `manifest.json`).

          A manually installed copy does not update itself. See the README for details.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP_FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP_FILE" --title "WideMark $GITHUB_REF_NAME" --notes-file release-notes.md
          fi

      - name: Upload & Submit for Review
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        with:
          file-path: ${{ steps.locate_zip.outputs.zip_path }}
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true
